name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Packages the add-on as TypeWhisper/ (see .pkgmeta), attaches the ZIP to a GitHub release and uploads it to
      # the CurseForge project named by X-Curse-Project-ID in TypeWhisper.toc.
      - uses: BigWigsMods/packager@v2
        env:
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
